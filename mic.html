<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Tarini - allow microphone</title><link rel="stylesheet" href="sidepanel.css"></head>
<body style="align-items:center;justify-content:center;padding:24px">
<div style="max-width:420px;text-align:center">
<span class="orb-mini" style="width:64px;height:64px;display:inline-block" aria-hidden="true"></span>
<h1 style="margin:14px 0 8px;font-size:24px">Let Tarini hear you</h1>
<p style="color:var(--muted)">Chrome asks for microphone permission once. Press the button and choose Allow. After that, the mic button in the Tarini panel works.</p>
<button class="pbtn" id="allow">Allow microphone</button>
<p id="out" role="status" style="margin-top:14px"></p>
</div>
<script src="mic.js"></script>
</body></html>
